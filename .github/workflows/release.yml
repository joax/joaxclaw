name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Check if the version in package.json already has a release ──────────────
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      should_release: ${{ steps.guard.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if release v${{ steps.pkg.outputs.version }} already exists
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Release v${VERSION} already exists — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for v${VERSION} — will build and release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Create the release first, with notes from CHANGELOG.md ──────────────────
  # A single job owns the release body so the build jobs (which only upload
  # assets) can never race it to an empty-bodied release.
  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Extract changelog notes for v${{ needs.check.outputs.version }}
        id: changelog
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          # Pull the body of the matching "## [VERSION]" section (until the next "## [").
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG.md entry for v${VERSION} — falling back to a generic note."
            NOTES="Release v${VERSION}. See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release (notes only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: JoaxClaw v${{ needs.check.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          # GitHub makes a *published* release immutable — assets can only be added
          # while it's still a draft. So create it as a draft here; the build jobs
          # attach the installers, and the final publish job flips it to published.
          draft: true
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux x64 DEB ───────────────────────────────────────────────────────────
  build-linux:
    needs: [check, release]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          # The runner image preinstalls third-party apt repos (Google Chrome, Microsoft,
          # …) that this build has no use for. `apt-get update` fails as a whole if ANY
          # configured repo serves an inconsistent index, so an upstream hiccup in one of
          # them takes the release down with it — which is what blocked v0.24.1:
          #
          #   Err: https://dl.google.com/linux/chrome-stable/deb stable/main amd64 Packages
          #     Hash Sum mismatch
          #
          # It was not transient; a re-run hit the identical mismatch. fakeroot, dpkg and
          # rpm all come from Ubuntu's own archive in /etc/apt/sources.list, so drop the
          # extra sources rather than depending on third parties to stay consistent.
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          sudo apt-get update -y
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package DEB
        run: npx electron-builder --linux deb --x64 --publish never

      # No upload-artifact: the installer is attached to the GitHub Release below
      # (durable, and separate from the Actions storage quota). Keeping a 90-day
      # artifact copy too just burned through the account's Actions storage.
      - name: Add DEB to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          # Keep it a draft while attaching — the publish job flips it once both
          # installers are in. (Omitting draft would default to false and publish
          # the release early, re-locking it before the other installer uploads.)
          draft: true
          files: dist/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS universal DMG (unsigned) ──────────────────────────────────────────
  build-mac:
    needs: [check, release]
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package DMG (universal, unsigned)
        run: npx electron-builder --mac dmg --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # No upload-artifact (see the DEB job) — the DMG is attached to the Release.
      - name: Add DMG to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          draft: true   # see build-linux — stay a draft until the publish job
          files: dist/*.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Publish: flip the draft to a real release once both installers are attached ─
  # Assets can't be added after publish (immutable releases), so this runs last.
  publish:
    needs: [check, build-linux, build-mac]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.check.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The site serves the installers now — the repo is private, so a release asset's
      # browser_download_url 404s for everyone without repo access. joaxclaw.ai/download/
      # <platform> resolves to the newest release per request (api/download.mjs), so this
      # release is downloadable the moment the step above publishes it, with no redeploy.
      #
      # The rebuild is therefore only cosmetic: the version label and file sizes baked
      # into the landing page. site/download.js fills those in client-side anyway, so a
      # failed ping warns rather than failing a release that has already shipped.
      - name: Refresh the site's version label
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set — the label updates on the next push to main. Downloads already work."
            exit 0
          fi
          if curl -fsS -X POST "$HOOK" > /dev/null; then
            echo "Asked Vercel to rebuild the site."
          else
            echo "::warning::The Vercel deploy hook failed — the landing page still shows the previous version number. Downloads are unaffected."
          fi

      # Prove the installers are actually reachable by the public.
      #
      # Everything above this point can succeed while downloads are broken for everyone:
      # the site needs RELEASES_TOKEN to read a private repo's releases, and if it is
      # missing or expired /download/<platform> answers 503 and nobody can install
      # anything. That used to be impossible to get wrong — the assets were public — so
      # it is worth finding out here rather than from a user.
      #
      # Usually the first request settles it: /download/<platform> resolves the newest
      # release per request, so a release that only publishes assets needs no redeploy
      # and passes immediately. The budget is for the releases that DO wait on one — the
      # first after the route shipped, or any following a spell where Vercel could not
      # deploy. The hook above only QUEUES a build, and `npm ci` plus two builds runs for
      # minutes, so polling from the instant it is queued can only ever see the
      # deployment that was already live: v0.27.2 failed here against five 15s attempts
      # while its build was still running. Release propagation and the five-minute CDN
      # cache on /api/release ride along in the same budget.
      - name: Check the site can serve the installers
        env:
          SITE: ${{ vars.SITE_URL || 'https://joaxclaw.ai' }}
          # A healthy release never spends this — it passes on the first request.
          BUDGET_SECONDS: ${{ vars.DOWNLOAD_CHECK_SECONDS || '600' }}
        run: |
          # No -L: a 302 to GitHub's signed url is the expected answer, and following it
          # would pull a 236MB installer onto the runner. The redirect target comes back
          # too — without it a 3xx is unreadable, and v0.27.2 spent two runs on a 308
          # nobody could place. A trailing-slash normalisation, another host, and a
          # signed asset url all look identical as a bare number.
          probe() { curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30 "$1" || echo "000 "; }

          # A release is not the moment to work out what a bare status code meant. These
          # three have different fixes, and 308 — Vercel redirecting a path it has no
          # route for — is the one that reads as a token problem but isn't.
          explain() {
            case "$1" in
              302)      echo "ok" ;;
              404)      echo "no /download route in the deployment being served — Vercel has not finished, or was not allowed to run, a build of the commit that added it" ;;
              30[1378]) echo "redirected somewhere that is not the installer, after following the site's own redirects" ;;
              503)      echo "the route is live but RELEASES_TOKEN is missing or expired in the Vercel project" ;;
              000)      echo "the site did not answer at all" ;;
              *)        echo "unexpected answer" ;;
            esac
          }

          # The site's apex 308s to www, and Vercel applies domain redirects BEFORE
          # rewrites — so /download/<platform> asked of the apex never reaches the rewrite
          # at all. The old check read that as "the public cannot download this release"
          # on a site working perfectly for visitors, and did so on every run since the
          # route shipped. A redirect that stays on the site is part of the path to the
          # installer, so follow it; the one that LEAVES the site is the answer, the
          # short-lived signed url. Still no -L anywhere: following that last hop would
          # pull a 236MB installer onto the runner.
          host_of() { local h=${1#*://}; h=${h%%/*}; echo "${h#www.}"; }
          site_host=$(host_of "$SITE")

          # "<code> <target>" for the first answer that is not a redirect within the site.
          resolve() {
            local url=$1 answer code target
            for _hop in 1 2 3; do
              answer=$(probe "$url"); code=${answer%% *}; target=${answer#* }
              case "$code" in 30[12378]) ;; *) break ;; esac
              [ -n "$target" ] || break
              [ "$(host_of "$target")" = "$site_host" ] || break
              echo "  ↳ $url → $code → $target (same site, following)" >&2
              url=$target
            done
            echo "$code $target"
          }

          # One budget for the step, not per platform: both are served by the same
          # deployment, so once one answers the other is a formality, and if the
          # deployment never arrives there is nothing to gain by waiting for it twice.
          deadline=$(( SECONDS + BUDGET_SECONDS ))
          fail=0

          for platform in mac linux; do
            url="$SITE/download/$platform"
            answer=$(resolve "$url"); code=${answer%% *}; target=${answer#* }
            while [ "$code" != "302" ] && [ "$SECONDS" -lt "$deadline" ]; do
              echo "  $url → HTTP $code${target:+ → $target} ($(explain "$code")) — $(( deadline - SECONDS ))s left"
              sleep 20
              answer=$(resolve "$url"); code=${answer%% *}; target=${answer#* }
            done
            if [ "$code" = "302" ]; then
              echo "✓ $url → 302"
            else
              echo "::error::$url answered HTTP $code${target:+, redirecting to $target}, not 302 — the public cannot download this release: $(explain "$code")."
              fail=1
            fi
          done
          exit $fail

  # ── Prune: keep only the 5 most recent releases (older releases removed; tags kept) ─
  prune:
    needs: [check, publish]
    if: needs.check.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/prune-releases.yml
    with:
      keep: '5'
