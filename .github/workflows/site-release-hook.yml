name: Refresh site

# Manually rebuild joaxclaw.ai — for when the site needs to pick up a release outside
# the normal flow (e.g. the automatic ping failed).
#
# Releases refresh the site automatically from the publish job in release.yml. This
# workflow used to listen for `release: published` instead, but that trigger never fired:
# a release published with GITHUB_TOKEN does not start other workflows. Vercel still
# rebuilds on every push to main through its own Git integration.
#
# Needs the VERCEL_DEPLOY_HOOK repository secret (Vercel → Settings → Git → Deploy Hooks,
# branch `main`). Without it, this no-ops.

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set — skipping the site rebuild."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Asked Vercel to rebuild the site."
